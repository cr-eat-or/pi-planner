# GitHub Actions CI PI-Planner: unit, pg, cycle, readme-numbers,
# schema-equivalence, web, e2e-ui, lint.
#
# Перенос с GitLab CI (бывший .gitlab-ci.yml). Состав проверок сохранён
# один в один: смысл джоб тот же, синтаксис — GitHub Actions.
# Джобы со статусом «пока не блокирует» помечены `continue-on-error: true`
# и комментарием, КОГДА это снимается (волна плана). Снять флаг — отдельным
# коммитом в той же волне, не откладывая.

name: CI

# Как в GitLab: проверки идут на push в долгоживущие ветки и на pull request.
# Ветка с открытым PR проверяется в прогоне PR — без дубля на push.
on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
  workflow_dispatch:

# Повторный push в ту же ветку отменяет предыдущий незавершённый прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
  # Сервис PostgreSQL: тот же мажор, что в docker-compose.yaml.
  POSTGRES_DB: pi_planner
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST_AUTH_METHOD: trust
  # Коммит, от которого считаются «старые» базы при проверке миграций:
  # вершина develop на момент приёма аудита (d5cde74).
  MIGRATION_BASE_REF: d5cde74

jobs:
  # --- Юнит-тесты (без базы): PostgreSQL-тесты здесь пропускаются ------------
  unit:
    name: unit (pytest без БД)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Кэш uv и pip
        uses: actions/cache@v4
        with:
          path: |
            .cache/uv
            .cache/pip
          key: py-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: py-${{ runner.os }}-
      - name: Установить uv и зависимости
        run: |
          pip install --quiet "uv>=0.12"
          uv sync --frozen --group dev
      - name: pytest
        run: uv run pytest -q -rs

  # --- Те же тесты с PostgreSQL: ни один тест не должен быть пропущен --------
  pg:
    name: pg (pytest с PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: pi_planner
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PI_PLANNER_DSN: "host=localhost port=5432 dbname=pi_planner user=postgres password=postgres"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/pi_planner"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Кэш uv и pip
        uses: actions/cache@v4
        with:
          path: |
            .cache/uv
            .cache/pip
          key: py-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: py-${{ runner.os }}-
      - name: Установить uv и зависимости
        run: |
          pip install --quiet "uv>=0.12"
          uv sync --frozen --group dev
      - name: Применить схему, контракт и seed
        run: uv run python tools/apply_sql.py --wait 60
      - name: pytest (пропуск PostgreSQL-тестов — ошибка)
        run: |
          rc=0
          uv run pytest -q -rs -p no:cacheprovider > pytest.log 2>&1 || rc=$?
          cat pytest.log
          if grep -q "нужен PostgreSQL" pytest.log; then
            echo "ОШИБКА: PostgreSQL-тесты пропущены, TEST_DATABASE_URL не сработал" >&2
            exit 1
          fi
          exit $rc
      - name: Артефакт pytest.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          retention-days: 7

  # --- Цикл: датасет -> базовый план -> факт спринтов 1–3, 0 ошибок приёмки --
  cycle:
    name: cycle (полный цикл квартала)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: pi_planner
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PI_PLANNER_DSN: "host=localhost port=5432 dbname=pi_planner user=postgres password=postgres"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/pi_planner"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Кэш uv и pip
        uses: actions/cache@v4
        with:
          path: |
            .cache/uv
            .cache/pip
          key: py-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: py-${{ runner.os }}-
      - name: Установить uv и зависимости
        run: |
          pip install --quiet "uv>=0.12"
          uv sync --frozen --group dev
      - name: Применить схему, контракт и seed
        run: uv run python tools/apply_sql.py --wait 60
      - name: Схема, контракт, seed, витрины, инварианты
        run: >
          uv run python tools/apply_sql.py
          db/01_schema.sql db/02_contract.sql build/seed.sql
          db/03_substitutions.sql db/04_views.sql db/05_invariants.sql
          db/06_migration_stamps.sql
      - name: Полный цикл квартала
        run: uv run python tools/ci_cycle_check.py --sprints 3

  # --- Числа README (§8, §9) совпадают с базовым планом на выданном датасете --
  readme-numbers:
    name: readme-numbers (числа README)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: pi_planner
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PI_PLANNER_DSN: "host=localhost port=5432 dbname=pi_planner user=postgres password=postgres"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/pi_planner"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Кэш uv и pip
        uses: actions/cache@v4
        with:
          path: |
            .cache/uv
            .cache/pip
          key: py-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: py-${{ runner.os }}-
      - name: Установить uv и зависимости
        run: |
          pip install --quiet "uv>=0.12"
          uv sync --frozen --group dev
      - name: Применить схему, контракт и seed
        run: uv run python tools/apply_sql.py --wait 60
      - name: Схема, контракт, seed, витрины, инварианты
        run: >
          uv run python tools/apply_sql.py
          db/01_schema.sql db/02_contract.sql build/seed.sql
          db/03_substitutions.sql db/04_views.sql db/05_invariants.sql
          db/06_migration_stamps.sql
      - name: Построить базовый план
        run: uv run python tools/run_planner.py
      - name: Сверить контрольные числа README
        run: uv run python tools/readme_numbers.py --check

  # --- Чистая установка и обновление дают одну и ту же схему -----------------
  # Чистая установка (db/01…06 + seed) и `migrate` — no-op; старая база
  # (MIGRATION_BASE_REF) + `migrate` — та же схема (B-1, B-7).
  schema-equivalence:
    name: schema-equivalence (fresh vs upgraded)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: pi_planner
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PI_PLANNER_DSN: "host=localhost port=5432 dbname=pi_planner user=postgres password=postgres"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/pi_planner"
    steps:
      # Полная история нужна для `git archive "$MIGRATION_BASE_REF"` ниже.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Кэш uv и pip
        uses: actions/cache@v4
        with:
          path: |
            .cache/uv
            .cache/pip
          key: py-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: py-${{ runner.os }}-
      - name: Установить uv и зависимости
        run: |
          pip install --quiet "uv>=0.12"
          uv sync --frozen --group dev
      - name: Применить схему, контракт и seed
        run: uv run python tools/apply_sql.py --wait 60
      - name: Создать пустые БД fresh и upgraded
        run: |
          uv run python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["PI_PLANNER_DSN"], autocommit=True) as c:
              for name in ("fresh", "upgraded"):
                  c.execute(f"DROP DATABASE IF EXISTS {name}")
                  c.execute(f"CREATE DATABASE {name}")
          PY
      # 1. Чистая установка из текущего дерева, затем migrate — обязан быть no-op.
      - name: Свежая установка из текущего дерева + migrate (no-op)
        env:
          PI_PLANNER_DSN: "host=localhost port=5432 dbname=fresh user=postgres password=postgres"
        run: |
          uv run python tools/apply_sql.py \
            db/01_schema.sql db/02_contract.sql build/seed.sql \
            db/03_substitutions.sql db/04_views.sql db/05_invariants.sql \
            db/06_migration_stamps.sql
          uv run python tools/migrate.py
          uv run python tools/schema_fingerprint.py > fresh.txt
      # 2. Старая база: базовые файлы MIGRATION_BASE_REF, затем все миграции.
      - name: Старая база MIGRATION_BASE_REF + все миграции
        env:
          PI_PLANNER_DSN: "host=localhost port=5432 dbname=upgraded user=postgres password=postgres"
        run: |
          mkdir -p /tmp/base
          git archive "$MIGRATION_BASE_REF" db build | tar -x -C /tmp/base
          uv run python tools/apply_sql.py \
            /tmp/base/db/01_schema.sql /tmp/base/db/02_contract.sql /tmp/base/build/seed.sql \
            /tmp/base/db/03_substitutions.sql /tmp/base/db/04_views.sql /tmp/base/db/05_invariants.sql
          uv run python tools/migrate.py
          uv run python tools/schema_fingerprint.py > upgraded.txt
      - name: Схемы обязаны совпадать
        run: diff -u fresh.txt upgraded.txt
      - name: Артефакты отпечатков схемы
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-fingerprints
          path: |
            fresh.txt
            upgraded.txt
          retention-days: 7

  # --- Фронт: сборка и свежесть закоммиченного web/dist ----------------------
  web:
    name: web (сборка и свежесть web/dist)
    runs-on: ubuntu-latest
    steps:
      # Полная история: `git diff -- web/dist` должен видеть все изменения.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: npm run build
        working-directory: web
        run: npm run build
      - name: web/dist не должен устареть
        run: |
          git diff --exit-code -- web/dist || { echo "web/dist устарел: выполните npm run build и закоммитьте" >&2; exit 1; }

  # --- Браузерная проверка входа и ролей (tests/e2e) ---------------------------
  # Сначала НЕ блокирует: сценарий проверен локально (chromium 1243), но в этом
  # образе на GitHub ещё не запускался. Снять continue-on-error после первого
  # зелёного прогона.
  e2e-ui:
    name: e2e-ui (вход и роли, браузер)
    runs-on: ubuntu-latest
    continue-on-error: true
    # Официальный образ Playwright: браузеры и системные зависимости уже внутри.
    # В образе по умолчанию root — sandbox Chromium отключён (как в GitLab CI).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: pi_planner
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Джоба идёт в контейнере: сервис доступен по метке `postgres`, не localhost.
      PI_PLANNER_DSN: "host=postgres port=5432 dbname=pi_planner user=postgres password=postgres"
      POSTGRES_DB: pi_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4
      - name: Установить uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Зависимости приложения (без dev)
        run: uv sync --frozen --no-dev
      - name: playwright-core
        run: |
          mkdir -p /tmp/e2e
          cd /tmp/e2e && npm init -y >/dev/null && npm i playwright-core@1.63.0 --no-audit --no-fund
      - name: Прогон браузерного сценария
        run: |
          mkdir -p e2e-out
          OUT="$GITHUB_WORKSPACE/e2e-out" NODE_PATH=/tmp/e2e/node_modules tests/e2e/run_auth_ui.sh
      - name: Артефакты e2e-out
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: e2e-out
          retention-days: 7

  # --- Стиль: ruff (правила E, F — pyproject.toml) -----------------------------
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Установить ruff
        run: pip install --quiet ruff
      - name: ruff check
        run: ruff check --output-format=concise app etl tools tests
